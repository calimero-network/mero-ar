# XcodeGen spec — regenerate MeroAR.xcodeproj with: `xcodegen generate`
# (from this directory) or `make app-gen` from the repo root.
name: MeroAR
options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# MeroKit + MeroKitUI are the shared Calimero Swift SDK
# (calimero-network/swift-sdk), on its Calimero 1.0 client: `CalimeroClient`
# over the sealed channel (the node's TDX quote verified first), passkey
# sign-in (`MeroClient`, `PlatformPasskey`, a `SoftPasskey` for `merod local`),
# organizations, app instances, invites and the consent page.
#
# Pinned to swift-sdk v0.6.0 (core 1.0.0-rc.10). Bump `exactVersion`
# for a new release.
#
# Local development against an SDK checkout: swap `exactVersion` for
# `path: ../../../swift-sdk` (or your worktree), regenerate, and do NOT commit that.
packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    exactVersion: 0.6.0

targets:
  MeroAR:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    # Native passkeys on a production cluster: its relying party is
    # `calimero.network`, which publishes this app in its
    # apple-app-site-association (`webcredentials`). Device builds also need
    # a signing team (DEVELOPMENT_TEAM below).
    entitlements:
      path: MeroAR.entitlements
      properties:
        com.apple.developer.associated-domains:
          - webcredentials:calimero.network
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mero AR
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Mero AR uses the camera to scan your room and place shared 3D objects in it."
        # `merod local` development clusters are plain http on the LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Mero AR connects to a development Calimero cluster on your network."
        UIRequiredDeviceCapabilities:
          - arkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.meroar
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5"
        # Passkeys on a real cluster need the associated domain (MeroAR.entitlements)
        # and a signing team; a `merod local` cluster uses a soft passkey and needs neither.
        # Set your team here (or pass DEVELOPMENT_TEAM=XXXX to xcodebuild) for device builds.
        # DEVELOPMENT_TEAM: ""
    dependencies:
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  MeroARTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests
    dependencies:
      - target: MeroAR
      # The tests build fixtures out of the SDK's `JSONValue`, so they link the
      # package directly rather than relying on the app target's copy.
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  MeroARUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: UITests
        optional: true
    dependencies:
      - target: MeroAR

schemes:
  MeroAR:
    build:
      targets:
        MeroAR: all
    run:
      config: Debug
    test:
      targets:
        - MeroARTests
        - MeroARUITests
