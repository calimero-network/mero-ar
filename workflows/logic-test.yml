name: Mero AR Logic Test
description: >
  Comprehensive merobox test of the Mero AR scene-graph WASM against a real merod
  node: room init, member join, object add with nested 3D transform, transform
  updates with version LWW, advisory lock enforcement, presence, spatial
  comments, roles, and delete. Verifies the WASM serializes the nested
  Transform/Vec3/Quat types correctly across calls.

  Since core rc.20 the contract takes NO caller-supplied identity: member ids,
  object attribution, lock holders, comment authors, and presence keys all come
  from `env::device_id()`. So the assertions here check against
  `{{member_public_key}}` — the node's own context identity — and prove that a
  spoofed `createdBy` on the way in is overwritten.

  Cross-identity behaviour (a viewer being rejected, an admin breaking someone
  else's lock) needs two accounts and lives in identity-and-roles.yml.

stop_all_nodes: true
restart: false
wait_timeout: 120

nodes:
  chain_id: testnet-1
  count: 1
  image: ghcr.io/calimero-network/merod:0.11.0-rc.24
  prefix: calimero-node
  # merobox defaults every node to RUST_LOG=debug — roughly 12 MB of container
  # log per node per couple of minutes, plus real CPU on a 2-vCPU runner that is
  # also hosting the nodes. `info` keeps the WARN/ERROR lines a failure is
  # actually diagnosed from. Raise it to `debug` when you need a specific
  # debug-only marker.
  log_level: info

steps:
  # ── Bootstrap ─────────────────────────────────────────────────────────────
  - name: Install Application
    type: install_application
    node: calimero-node-1
    path: "../logic/res/mero_ar.wasm"
    dev: true
    outputs:
      app_id: applicationId

  - name: Create Namespace
    type: create_namespace
    node: calimero-node-1
    application_id: "{{app_id}}"
    outputs:
      namespace_id: namespaceId

  - name: Create Room Context
    type: create_context
    node: calimero-node-1
    application_id: "{{app_id}}"
    group_id: "{{namespace_id}}"
    params: '{"name": "Test Room"}'
    outputs:
      context_id: contextId
      member_public_key: memberPublicKey

  - name: Get Room
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_room
    args: {}
    outputs:
      room: result

  # The name comes from `initial_name`, because `Ownable::insert` at init is
  # silently dropped on rc.20 — if this ever returns an empty name, that trap
  # has been re-introduced.
  - name: Assert Room Name
    type: assert
    statements:
      - "contains({{room}}, 'Test Room')"

  # ── Roles: the creator is admin + owner ───────────────────────────────────
  - name: My Role
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: my_role
    args: {}
    outputs:
      role: result

  - name: Assert Creator Is Admin
    type: assert
    statements:
      - "contains({{role}}, 'admin')"

  - name: Can Edit
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: can_edit
    args: {}
    outputs:
      editable: result

  # A bool comes back through merobox as a Python value, so `contains` would be
  # comparing against "True". Match case-insensitively instead of betting on the
  # repr.
  - name: Assert Creator Can Edit
    type: assert
    statements:
      - "regex({{editable}}, '(?i)true')"

  # A key nobody has ever written with has no account mapping, so no grant can
  # name it — it must read as viewer rather than erroring.
  - name: Role Of Unknown Member
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_role
    args:
      member: "11111111111111111111111111111111"
    outputs:
      stranger_role: result

  - name: Assert Unknown Member Is Viewer
    type: assert
    statements:
      - "contains({{stranger_role}}, 'viewer')"

  # ── Members ────────────────────────────────────────────────────────────────
  # `join` takes only a display name now; the id is the signer.
  - name: Join as Alice
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: join
    args:
      username: "Alice"
      avatar: null
      timestamp: 1000000

  - name: Get Members
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_members
    args: {}
    outputs:
      members: result

  # Ask the contract who we are, rather than assuming it is the context member
  # key. Since rc.23 every member id here is an ACCOUNT — what the members map,
  # roster, objects, locks, presence and comments are all keyed by — while
  # `member_public_key` is the context member KEY that authorizes a call. They
  # are different values in different alphabets, so asserting one against the
  # other silently never matches.
  - name: Read Own Member Id
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: whoami
    args: {}
    outputs:
      my_member_id: result.output

  - name: Assert Member Is The Signer
    type: assert
    statements:
      - "contains({{members}}, 'Alice')"
      - "contains({{members}}, '{{my_member_id}}')"

  - name: List Roles
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: list_roles
    args: {}
    outputs:
      roster: result

  - name: Assert Roster Shows Admin
    type: assert
    statements:
      - "contains({{roster}}, 'admin')"
      - "contains({{roster}}, '{{my_member_id}}')"

  # ── Add object with nested transform ──────────────────────────────────────
  # `createdBy` is deliberately a lie here: the contract must overwrite it with
  # the signer, and `lockedBy` must not be honoured on the way in.
  - name: Add Cube
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: add_object
    args:
      object:
        id: "o1"
        data: { kind: "cube" }
        transform:
          position: { x: 1.0, y: 0.5, z: -2.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0, w: 1.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        color: "3A86FF"
        lockedBy: "spoofedholder"
        createdBy: "spoofedauthor"
        createdAt: 1000001
        updatedAt: 1000001
        version: 0

  - name: Get Objects After Add
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_objects
    args: {}
    outputs:
      objects: result

  - name: Assert Cube Added And Attributed To The Signer
    type: assert
    statements:
      - "contains({{objects}}, 'o1')"
      - "contains({{objects}}, 'cube')"
      - "contains({{objects}}, '{{my_member_id}}')"
      - "not_contains({{objects}}, 'spoofedauthor')"
      - "not_contains({{objects}}, 'spoofedholder')"

  # ── Transform update (version LWW) ─────────────────────────────────────────
  - name: Move Cube To 111
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: update_transform
    args:
      id: "o1"
      transform:
        position: { x: 111.0, y: 1.0, z: -3.0 }
        rotation: { x: 0.0, y: 0.0, z: 0.0, w: 1.0 }
        scale: { x: 1.0, y: 1.0, z: 1.0 }
      updated_at: 2000000

  - name: Get Object After Move
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_object
    args:
      id: "o1"
    outputs:
      moved: result

  - name: Assert Moved To 111
    type: assert
    statements:
      - "contains({{moved}}, '111')"

  # ── Lock: taken in the caller's own name ───────────────────────────────────
  - name: Lock Cube
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: lock_object
    args:
      id: "o1"

  - name: Get Object After Lock
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_object
    args:
      id: "o1"
    outputs:
      locked: result

  - name: Assert Locked By The Signer
    type: assert
    statements:
      - "contains({{locked}}, '{{my_member_id}}')"

  - name: Holder Moves To 222
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: update_transform
    args:
      id: "o1"
      transform:
        position: { x: 222.0, y: 1.0, z: -3.0 }
        rotation: { x: 0.0, y: 0.0, z: 0.0, w: 1.0 }
        scale: { x: 1.0, y: 1.0, z: 1.0 }
      updated_at: 4000000

  - name: Get Object After Holder Move
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_object
    args:
      id: "o1"
    outputs:
      holder_moved: result

  - name: Assert Holder Could Move
    type: assert
    statements:
      - "contains({{holder_moved}}, '222')"

  # Colour now honours the same lock as the transform.
  - name: Holder Recolours
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: update_color
    args:
      id: "o1"
      color: "FF00AA"
      updated_at: 4500000

  - name: Get Object After Recolour
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_object
    args:
      id: "o1"
    outputs:
      recoloured: result

  - name: Assert Recoloured
    type: assert
    statements:
      - "contains({{recoloured}}, 'FF00AA')"

  - name: Unlock Cube
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: unlock_object
    args:
      id: "o1"

  - name: Move To 333 After Unlock
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: update_transform
    args:
      id: "o1"
      transform:
        position: { x: 333.0, y: 1.0, z: -3.0 }
        rotation: { x: 0.0, y: 0.0, z: 0.0, w: 1.0 }
        scale: { x: 1.0, y: 1.0, z: 1.0 }
      updated_at: 5000000

  - name: Get Object After Unlock Move
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_object
    args:
      id: "o1"
    outputs:
      unlocked_moved: result

  - name: Assert Could Move After Unlock
    type: assert
    statements:
      - "contains({{unlocked_moved}}, '333')"

  # ── Presence: keyed by the signer, no identity argument ────────────────────
  - name: Update Presence
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: update_presence
    args:
      camera_position: { x: 0.0, y: 1.6, z: 0.0 }
      camera_rotation: { x: 0.0, y: 0.0, z: 0.0, w: 1.0 }
      updated_at: 6000000

  - name: Get Presence
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_presence
    args: {}
    outputs:
      presence: result

  - name: Assert Presence Keyed By Signer
    type: assert
    statements:
      - "contains({{presence}}, '{{my_member_id}}')"

  # ── Spatial comment: author is the signer ─────────────────────────────────
  - name: Add Comment
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: add_comment
    args:
      id: "c1"
      text: "spatialnote"
      position: { x: 1.0, y: 1.0, z: 1.0 }
      created_at: 7000000

  - name: Get Comments
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_comments
    args: {}
    outputs:
      comments: result

  - name: Assert Comment Stored And Attributed
    type: assert
    statements:
      - "contains({{comments}}, 'spatialnote')"
      - "contains({{comments}}, '{{my_member_id}}')"

  - name: Delete Own Comment
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: delete_comment
    args:
      id: "c1"

  - name: Get Comments After Delete
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_comments
    args: {}
    outputs:
      comments_after: result

  - name: Assert Comment Deleted
    type: assert
    statements:
      - "not_contains({{comments_after}}, 'spatialnote')"

  # ── Room metadata: owner-gated rename + world map ─────────────────────────
  - name: Rename Room
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: rename_room
    args:
      name: "Renamed Studio"

  - name: Set World Map
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: set_world_map
    args:
      blob_id: "worldmapblobref"

  - name: Get Room After Updates
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_room
    args: {}
    outputs:
      room_after: result

  # The owner-gated cell now holds a value, so it wins over `initial_name`, and
  # `owner` resolves the owning ACCOUNT back to the member id clients know.
  - name: Assert Rename And World Map Landed
    type: assert
    statements:
      - "contains({{room_after}}, 'Renamed Studio')"
      - "contains({{room_after}}, 'worldmapblobref')"
      - "contains({{room_after}}, '{{my_member_id}}')"

  # ── Delete ────────────────────────────────────────────────────────────────
  - name: Delete Object
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: delete_object
    args:
      id: "o1"

  - name: Get Objects After Delete
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_objects
    args: {}
    outputs:
      final_objects: result

  - name: Assert Object Deleted
    type: assert
    statements:
      - "not_contains({{final_objects}}, 'o1')"

  # ── Admin-only clear ──────────────────────────────────────────────────────
  - name: Add Cube To Clear
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: add_object
    args:
      object:
        id: "o2"
        data: { kind: "sphere" }
        transform:
          position: { x: 0.0, y: 0.0, z: 0.0 }
          rotation: { x: 0.0, y: 0.0, z: 0.0, w: 1.0 }
          scale: { x: 1.0, y: 1.0, z: 1.0 }
        color: "3A86FF"
        lockedBy: null
        createdBy: "ignored"
        createdAt: 8000000
        updatedAt: 8000000
        version: 0

  - name: Clear Objects
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: clear_objects
    args: {}

  - name: Get Objects After Clear
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    executor_public_key: "{{member_public_key}}"
    method: get_objects
    args: {}
    outputs:
      cleared_objects: result

  - name: Assert Scene Cleared
    type: assert
    statements:
      - "not_contains({{cleared_objects}}, 'o2')"
