# CI for Mero AR.
name: ci

on:
  push:
    branches: [master]
  pull_request:

# Without this, a push landing on top of an in-flight push leaves BOTH runs to
# completion — and this repo's `app` job is a macOS runner, billed at ten times
# the Linux rate. Superseded runs are the most expensive thing here.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic:
    name: WASM contract (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logic
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Install cargo-mero
        uses: ./.github/actions/install-cargo-mero
      - run: cargo test
      - run: cargo clippy --target wasm32-unknown-unknown --profile app-release -- -D warnings
      # `cargo mero build` also emits + embeds the ABI, so a public type missing
      # an `AbiType` impl fails here rather than at bundle time.
      - name: Build WASM (+ ABI embed)
        run: cargo mero build

  # There is no MeroKit job any more: the Swift client is the shared SDK
  # (calimero-network/swift-sdk), tested in its own repo. This app's job is to
  # prove it still builds and passes its tests against the pinned SDK revision
  # in app/MeroAR/project.yml.
  app:
    name: iOS app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - working-directory: app/MeroAR
        run: xcodegen generate
      # Pin the toolchain rather than inherit the image's default: the runtimes
      # installed differ per Xcode (26.x runtimes only exist for 26.x), and a
      # default bump would silently change which simulators exist.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      # On a cold runner CoreSimulator often isn't up yet, so xcodebuild's device
      # list comes back EMPTY and it fails after a 60s search with "no available
      # devices matched" — even though the image ships plenty. Touching simctl
      # starts the service; then wait for a real device and address it by UDID,
      # which also survives the image renaming its iPhone models.
      - name: Wait for a simulator, then run app tests
        working-directory: app/MeroAR
        env:
          # Empty on a debug re-run, so the full build transcript comes back.
          XCB_QUIET: ${{ runner.debug == '1' && '' || '-quiet' }}
        run: |
          set -euo pipefail
          udid=""
          for attempt in $(seq 1 20); do
            udid=$(xcrun simctl list devices available -j \
              | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next((x["udid"] for rt in d for x in d[rt] if "iPhone" in x["name"]), ""))')
            [ -n "$udid" ] && break
            echo "attempt $attempt: no iPhone simulator yet, waiting…"
            sleep 5
          done
          if [ -z "$udid" ]; then
            echo "::error::no iOS simulator became available — tests did NOT run"
            xcrun simctl list devices
            exit 1
          fi
          echo "using simulator $udid"
          xcrun simctl boot "$udid" || true
          # -quiet drops xcodebuild's build graph — the SwiftCompile /
          # WriteAuxiliaryFile / `cd …` lines that are 95% of this job's log and
          # tell you nothing when it passes. Warnings, errors and the test
          # summary still print. A debug re-run gets the full transcript back.
          xcodebuild test $XCB_QUIET -project MeroAR.xcodeproj -scheme MeroAR \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath .build -only-testing:MeroARTests \
            CODE_SIGNING_ALLOWED=NO

  # Every *.yml under workflows/ becomes its own matrix leg, so adding a
  # scenario is adding a file — nothing here needs editing. The previous job
  # named its two scenarios in two places (validate + run), which is how
  # convergence-test.yml would have been wired up once and forgotten once.
  #
  # ⚠️ The empty-glob guard is load-bearing, not tidiness. A matrix built from a
  # glob that matches nothing produces ZERO legs and the job reports SUCCESS, so
  # a renamed directory would read as "all scenarios passed" — green by absence,
  # which this repo has been bitten by before. Fail loudly instead.
  discover-workflows:
    name: Discover merobox scenarios
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.find.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          set -euo pipefail
          list=$(cd workflows && ls -1 *.yml 2>/dev/null | sort || true)
          if [ -z "$list" ]; then
            echo "::error::no *.yml under workflows/ — this lane would report success having run nothing"
            exit 1
          fi
          echo "scenarios=$(printf '%s\n' "$list" | jq -R -s -c 'split("\n")|map(select(length>0))')" >> "$GITHUB_OUTPUT"
          echo "will run:"; printf '  %s\n' $list

  logic-workflows:
    name: merobox (${{ matrix.scenario }})
    needs: [discover-workflows]
    runs-on: ubuntu-latest
    strategy:
      # One scenario's failure must not cancel the others: when a core release
      # changes behaviour they tend to fail for the SAME reason, and seeing
      # which ones do is the diagnosis.
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.discover-workflows.outputs.scenarios) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install cargo-mero
        uses: ./.github/actions/install-cargo-mero
      # A signed bundle, not just the wasm: since core#3652 (0.11.0-rc.31) the
      # node refuses a raw .wasm on a dev install, which is what the workflow
      # fixtures hand it. `scripts/workflows.sh` builds this too if it is
      # missing; doing it here keeps the build failure in its own step.
      - name: Build the .mpk bundle
        run: cd logic && cargo mero bundle --dev --no-icon --app-version 0.0.0 --output res/mero-ar.mpk
      # merobox has had a console-verbosity knob since 0.6.30 (merobox#271): `quiet`
      # keeps the banners and the final pass/fail summary and drops the per-step
      # API-response dumps. Day to day that is what you want; to get the full detail
      # back, re-run the job with "Enable debug logging" and GitHub sets runner.debug,
      # which flips this to `verbose`. No second workflow, no flag to remember.
      #
      # It goes through $GITHUB_ENV rather than a workflow-level `env:` because the
      # `runner` context does not exist at workflow or job level — only inside a step.
      - name: Quiet merobox and its nodes on the happy path
        run: |
          # merobox's own console output.
          echo "MEROBOX_LOG_LEVEL=${{ runner.debug == '1' && 'verbose' || 'quiet' }}" >> "$GITHUB_ENV"
          # RUST_LOG for the merod nodes merobox boots. This has to go on the CLI:
          # `bootstrap run --log-level` defaults to "debug", so the value is never
          # None and merobox's `config.get("log_level")` fallback is unreachable — a
          # `log_level:` key in the workflow YAML is silently ignored.
          echo "MEROD_LOG=${{ runner.debug == '1' && 'debug' || 'info' }}" >> "$GITHUB_ENV"
      # ⚠️ BOTH pins are `==`, and they are a PAIR — see the comment below.
      #
      # ⚠️ Still load-bearing, despite 0.7.0 being the first calimero-client-py
      # with a `bdist_wheel`: that wheel is **Windows only**
      # (`cp313-cp313-win_amd64`, from client-py#103/#104). Linux gets the sdist,
      # so a cold `pip install` still compiles the Rust extension on the runner —
      # 92 seconds of a 134-second step, measured. pip reuses wheels it builds
      # itself from ~/.cache/pip/wheels, so every run after the first is a few
      # seconds. Do not drop this on the strength of "it ships a wheel now";
      # check the wheel's platform tag first. Bump the key with the pins.
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-merobox-0.6.75-ccpy-0.7.0
      # ⚠️ Pinning merobox pins NOTHING on its own: calimero-client-py is an
      # unpinned transitive dependency that tracks core, so pip is free to take a
      # newer one than the merobox on this line was ever built against. That is
      # not hypothetical — 0.7.0 removed the `metadata` kwarg merobox passed, and
      # every unpinned install in the fleet died at `install_application` with
      # `TypeError: unexpected keyword argument 'metadata'` on 2026-09-02.
      #
      # The rule: take the client-py that was newest when THAT merobox was built.
      # 0.6.75 (2026-09-02 21:34) is the first merobox built against 0.7.0 — it
      # declares `calimero-client-py>=0.7.0` — so 0.7.0 is its pair.
      #
      # Moving up from 0.6.29 is not optional here. client-py 0.7.0 is the release
      # that repinned onto 0.11.0-rc.31 and installs by coordinates (its #107),
      # which is the same core#3652 change that took raw wasm out of the protocol;
      # and 0.6.29 predates its #102/#105, which stopped the client dropping
      # `admitters` and the admitter addresses from an invitation on re-encode —
      # the drop that makes an rc.29+ node refuse the join in the two-node
      # workflow. Bump both together, and bump the cache key with them.
      - name: Install merobox
        run: pip install -q --disable-pip-version-check "merobox==0.6.75" "calimero-client-py==0.7.0"
      # Schema-check first: a typo in a step name/field otherwise only shows up
      # after several minutes of node boot.
      #
      # SCENARIO travels through the environment rather than being interpolated
      # into the script. A `${{ }}` expression is substituted before the shell
      # sees the line, and this value is a filename from the repo, so inlining
      # it would let a crafted name run as code.
      - name: Validate workflow schema
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: cd workflows && merobox bootstrap validate "$SCENARIO"
      - name: Run merobox workflow (boots merod in Docker)
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: bash scripts/workflows.sh "$SCENARIO"
