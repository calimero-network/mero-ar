# CI for Mero AR.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  logic:
    name: WASM contract (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: logic
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Install cargo-mero
        uses: ./.github/actions/install-cargo-mero
      - run: cargo test
      - run: cargo clippy --target wasm32-unknown-unknown --profile app-release -- -D warnings
      # `cargo mero build` also emits + embeds the ABI, so a public type missing
      # an `AbiType` impl fails here rather than at bundle time.
      - name: Build WASM (+ ABI embed)
        run: cargo mero build

  merokit:
    name: MeroKit (Swift)
    runs-on: macos-14
    defaults:
      run:
        working-directory: app/MeroKit
    steps:
      - uses: actions/checkout@v4
      - run: swift run merokit-verify   # no-Xcode pure-logic smoke test
      - run: swift test                 # full XCTest suite (Xcode on the runner)

  app:
    name: iOS app build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - working-directory: app/MeroAR
        run: xcodegen generate
      - working-directory: app/MeroAR
        name: Build + run app unit tests
        run: |
          xcodebuild test -project MeroAR.xcodeproj -scheme MeroAR \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath .build -only-testing:MeroARTests \
            CODE_SIGNING_ALLOWED=NO

  logic-workflows:
    name: WASM logic workflows (merobox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install cargo-mero
        uses: ./.github/actions/install-cargo-mero
      - name: Build WASM
        run: cd logic && cargo mero build
      - name: Install merobox
        run: pipx install merobox || pip install merobox
      - name: Run merobox workflows (boots merod in Docker)
        run: bash scripts/workflows.sh
