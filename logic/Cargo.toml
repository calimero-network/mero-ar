[package]
name = "mero-ar"
description = "Mero AR — collaborative spatial editing on Calimero"
# NOT the release version. cargo requires a version field, but
# .github/workflows/deploy-bundle.yml ignores it: the registry owns the number —
# the check job takes the highest published appVersion and increments the patch
# (0.0.1 when nothing is published yet). Bumping this changes nothing about what
# gets released, so do not read a shipped version out of the tree; read it from
# the registry or the workflow's run summary.
version = "0.0.2"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Read by `cargo mero bundle` (core #3374): every field the node and the
# registry render now has a producer here, so nothing hand-writes a
# manifest.json. `appVersion` is deliberately absent — the deploy workflow
# resolves it from the registry with `--bump patch`.
#
# No `frontend`: this ships as a native iOS app (MeroKit), not a web app the
# node would open in a browser.
[package.metadata.calimero]
package = "com.calimero.mero-ar"
name = "Mero AR"
description = "Mero AR — collaborative spatial editing on the Calimero p2p network."
author = "Calimero"
# The desktop resolves a deep link (calimero://<slug>/…) by Application.package,
# so the slug IS the package id.
slug = "com.calimero.mero-ar"
tags = ["ar", "spatial", "collaboration"]
github = "https://github.com/calimero-network/mero-ar"
# The oldest node that can run this bundle, and the SDK tag it was built and
# tested against. It must name a real runtime: the roster, the admin tier and
# the room's owner are all keyed by `env::account_id()`, and an rc.22-or-older
# node hands the same 32 bytes a DIFFERENT meaning through the `executor_id`
# shim — nothing errors, the room just counts one person twice. So an older node
# must refuse the install rather than diverge quietly.
min-runtime-version = "0.11.0-rc.31"

[dependencies]
borsh = "0.10.3"
borsh-derive = "0.10.3"
# Pin a real release tag, never `branch = "master"`: master rides unreleased
# protocol work against nodes that run the release. All SDK crates must share
# the exact same tag (the workspace version at a tag is 0.0.0).
calimero-sdk = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.31" }
calimero-storage = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.31" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core", tag = "0.11.0-rc.31" }
thiserror = "1.0.56"
serde_json = "1.0.113"
# Renders a `DeviceId` the way core writes every id — see `caller_device`.
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
