# XcodeGen spec — regenerate MeroAR.xcodeproj with: `xcodegen generate`
# (from this directory) or `make app-gen` from the repo root.
name: MeroAR
options:
  bundleIdPrefix: network.calimero
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# MeroKit + MeroKitUI are the shared Calimero Swift SDK
# (calimero-network/swift-sdk): Cloud sign-in (`CloudSignIn`, `RelayClient`,
# `MeroClient.signInWithCloud`), the relay session every contract call goes
# through, and the node admin API for node sign-in.
#
# Pinned to a release, `from: 0.4.0` (the security-review fixes: https-only
# remote hosts, enrolment callbacks need a pending state, bounded invites and
# responses, Keychain account state cleared on sign-out; plus joins on core
# rc.90 relays and blobs through the relay), so a clean build cannot pick up
# whatever landed on the SDK's `master` that morning.
#
# Local development against an unmerged SDK checkout: swap the two lines below
# for `path: ../../../swift-sdk` (or your worktree), regenerate, and do NOT
# commit that.
packages:
  MeroKit:
    url: https://github.com/calimero-network/swift-sdk
    from: 0.4.0

targets:
  MeroAR:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Mero AR
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Mero AR uses the camera to scan your room and place shared 3D objects in it."
        UIRequiredDeviceCapabilities:
          - arkit
        # The wallet returns to meroar://enrol after the passkey approval.
        CFBundleURLTypes:
          - CFBundleURLName: network.calimero.meroar.enrol
            CFBundleURLSchemes:
              - meroar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.calimero.meroar
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5"
        # Set your team here (or pass DEVELOPMENT_TEAM=XXXX to xcodebuild) for device builds.
        # DEVELOPMENT_TEAM: ""
    dependencies:
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  MeroARTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests
    dependencies:
      - target: MeroAR
      # The tests build fixtures out of the SDK's `JSONValue`, so they link the
      # package directly rather than relying on the app target's copy.
      - package: MeroKit
        product: MeroKit
      - package: MeroKit
        product: MeroKitUI

  MeroARUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: UITests
        optional: true
    dependencies:
      - target: MeroAR

schemes:
  MeroAR:
    build:
      targets:
        MeroAR: all
    run:
      config: Debug
    test:
      targets:
        - MeroARTests
        - MeroARUITests
